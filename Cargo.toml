[package]
name = "afterimage"
version = "0.4.0"
edition = "2021"
description = "Fast image viewer"
license = "MIT"
repository = "https://github.com/Hoyeom/afterimage"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "rayon"] }
rfd = "0.18"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp", "Win32_Globalization"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
natord = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false }
getrandom = "0.3"
sha2 = "0.10"
