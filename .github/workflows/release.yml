name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Builds from a clean state and leaves a draft. Publishing needs the signing
  # key, which isn't on GitHub: run scripts\publish.ps1 afterwards.
  draft:
    runs-on: windows-latest
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Tag must match Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"

      - run: cargo test --release --locked

      - run: cargo build --release --locked

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            target/release/afterimage.exe
